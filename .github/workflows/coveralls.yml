name: coveralls

on: push

jobs:
  test:
    name: Coveralls Upload
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run JavaScript/TypeScript tests
        run: bun run test

      # Sets up Nightly, configures problem matchers, and includes coverage components natively
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-04-30
          components: rustfmt, clippy, llvm-tools-preview

      # Automatically restores and saves the compiled grcov binary between CI runs
      - name: Cache grcov
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/grcov
          key: ${{ runner.os }}-grcov-bin

      - name: Install grcov & system tools
        run: |
          sudo apt-get update && sudo apt-get install -y lcov
          command -v grcov >/dev/null 2>&1 || cargo install grcov

      - name: Update dependencies
        run: cargo update

      - name: Build Rust project
        run: cargo build --workspace --features nightly
        env:
          RUSTFLAGS: '-Z unstable-options'

      - name: Run Rust tests with coverage
        run: |
          export CARGO_INCREMENTAL=0
          export RUSTFLAGS='-Cinstrument-coverage -Z unstable-options'
          export LLVM_PROFILE_FILE='cargo-test-%p-%m.profraw'
          cargo test --workspace --features nightly
          grcov . --binary-path ./target/debug/ -s . -t lcov --branch --ignore-not-existing --ignore "/*/.cargo/*" --ignore "/*/target/*" -o ./coverage/rust-lcov.info

      # - name: Run Rust tests with coverage
      #   run: |
      #     grcov . --binary-path ./target/debug/ -s . -t lcov --branch --ignore-not-existing --ignore "/*/.cargo/*" --ignore "/*/target/*" -o ./coverage/rust-lcov.info
      #   env:
      #     CARGO_INCREMENTAL: 0
      #     RUSTFLAGS: '-Cinstrument-coverage -Z unstable-options'
      #     LLVM_PROFILE_FILE: 'cargo-test-%p-%m.profraw'

      # Merge LCOV reports
      - name: Merge Bun and Rust LCOV reports
        run: |
          mkdir -p coverage
          if [ -f ./coverage/lcov.info ] && [ -f ./coverage/rust-lcov.info ]; then
            cat ./coverage/rust-lcov.info >> ./coverage/lcov.info
          elif [ -f ./coverage/rust-lcov.info ]; then
            mv ./coverage/rust-lcov.info ./coverage/lcov.info
          fi

      # upload to Coveralls
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          files: ./coverage/lcov.info
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
