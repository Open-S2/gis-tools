[package]
name = "gis-tools"
version = "1.3.0"
rust-version = "1.91.0"
edition = "2024"
authors = ["Craig O'Connor <oconnorct1@gmail.com>"]
description = "A collection of geospatial tools primarily designed for WGS84, Web Mercator, and S2."
documentation = "https://docs.rs/gis-tools"
homepage = "https://github.com/Open-S2/gis-tools"
repository = "https://github.com/Open-S2/gis-tools"
readme = "README.md"
categories = ["no-std", "algorithms"]
keywords = ["tools", "s2", "gis", "low-cost-code"]
license = "SEE LICENSE"

[package.metadata.docs.rs]
rustdoc-args = [ "--html-in-header", "katex-header.html" ]

[lib]
name = "gistools"
path = "rust/lib.rs"

[[bin]]
name = "gis-tools"
path = "rust/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Open S2 dependencies
earclip = "1.7"
open-vector-tile = "1.9"
pbf = "1.22"
s2json = "1.44"
s2-tilejson = "1.10"
# External shared dependencies
libm = "0.2"
half = "2.7"
regex = { version = "1", default-features = false }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
# Optional std dependencies
# rayon = { version = "1", optional = true }
memmap2 = { version = "0.9", optional = true }
flate2 = { version = "1", optional = true }
brotli = { version = "8", optional = true }
image = { version = "0.25", optional = true, features = ["jpeg", "tiff"] }
# Optional std/wasm fetch dependency
surf = { version = "2", default-features = false }
# CLI dependency
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
criterion = { version = "0.7", features = ["html_reports"] }
rand = "0.9"
tiff = "0.10.3"
tiny_http = "0.12"
smol = "2"
# We need the float_roundtrip feature for serde_json to match javascript float results
serde_json = { version = "1.0", default-features = false, features = ["alloc", "float_roundtrip"] }

[features]
default = ["std", "quadratic"] # Default feature
quadratic = []                 # Feature for quadratic projection
tan = []                       # Feature for tangential projection
linear = []                    # Feature for linear projection
nightly = []                   # Nightly system for improving coverage accuracy reporting
# Conditional std feature enabling quadratic or other projection features
std = ["memmap2", "flate2", "brotli", "image", "surf/h1-client"]
# Conditional wasm feature for browser tools like fetching
wasm = ["surf/wasm-client"]

[[bench]]
name = "s2_cells"
harness = false

[[bench]]
name = "delaunator"
harness = false

[[bench]]
name = "dekink"
harness = false

[[bench]]
name = "clean"
harness = false

[[bench]]
name = "union"
harness = false

[profile.bench]
inherits = "release"
opt-level = 3
# un-comment these when using flamegraph.
# debug = true
# [profile.release]
# debug = true

[profile.dev.package]
image.opt-level = 3
adler2.opt-level = 3
crc32fast.opt-level = 3
miniz_oxide.opt-level = 3
png.opt-level = 3
fdeflate.opt-level = 3
flate2.opt-level = 3
